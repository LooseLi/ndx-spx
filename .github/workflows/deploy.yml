name: 部署网页

on:
  # 人工 push 代码变更时部署
  push:
    branches: [main]
  # 额度监控用 GITHUB_TOKEN push 不会触发 push 事件（GitHub 防循环机制），
  # 因此在额度监控完成后通过 workflow_run 衔接部署
  workflow_run:
    workflows: [额度监控]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 新的部署直接顶掉排队中的旧部署，页面只需保持最新
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # workflow_run 仅在额度监控成功时部署；push / 手动触发不受影响
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # workflow_run 的 head_sha 是监控任务「开始时」的 commit，不含 bot 新 push 的数据。
      # 必须拉分支最新 tip，才能读到刚回写的 data/latest.json
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: 构建静态页
        env:
          # Pages 的 project site 部署在 /<仓库名> 子路径下，
          # 不设这个前缀会导致 JS/CSS 全部 404
          BASE_PATH: /ndx-spx
        run: npm run build

      # 不加这个文件，Jekyll 会忽略 Next.js 的 _next 目录
      - name: 跳过 Jekyll 处理
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
