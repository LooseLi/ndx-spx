name: 额度监控

on:
  # 定时由 Cloudflare Worker Cron 触发，见 docs/cloudflare-worker.md
  workflow_dispatch:
    inputs:
      rebuild_pool:
        description: '同时重建基金池'
        type: boolean
        default: false
      test_notify:
        description: '发一条测试推送（用于验证 Secret 是否配对）'
        type: boolean
        default: false

# 同一时间只跑一个，避免并发 commit 冲突
concurrency:
  group: track
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # 推送渠道配置对多个步骤都要用，提到 job 级别避免重复
    env:
      FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
      FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
      WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
      SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
      WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
      WXPUSHER_UIDS: ${{ secrets.WXPUSHER_UIDS }}
      WXPUSHER_TOPIC_IDS: ${{ secrets.WXPUSHER_TOPIC_IDS }}
      SITE_URL: ${{ vars.SITE_URL }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # 用 github.event.inputs：inputs 简写在部分触发上下文里不存在，校验会失败
      - name: 重建基金池
        if: github.event.inputs.rebuild_pool == 'true'
        run: npm run pool

      - name: 抓取额度并推送变更
        run: npm run track

      # 无变更时 track 会静默退出，无法验证 Secret，所以留一个手动自检开关
      - name: 推送自检
        if: github.event.inputs.test_notify == 'true'
        run: npm run notify:test

      - name: 回写数据
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data
          git commit -m "chore: 更新基金额度快照 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          # 定时任务之间可能有推送竞争，rebase 后重试一次
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push
